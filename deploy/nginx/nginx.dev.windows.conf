worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 220m;
    default_type application/octet-stream;

    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/jpeg jpg jpeg;
        image/png png;
        image/webp webp;
        image/gif gif;
        font/woff woff;
        font/woff2 woff2;
        application/vnd.ms-fontobject eot;
        font/ttf ttf;
        font/otf otf;
    }

    server {
        listen 0.0.0.0:8080;
        server_name 127.0.0.1 localhost 10.138.78.52 10.133.131.67;

        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_redirect off;
        }

        location /media/ {
            alias "D:/98281/online education platform/WHU-ol-education-platform/backend/media/";
            types {
                video/mp4 mp4;
                video/webm webm;
                video/quicktime mov;
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
                application/pdf pdf;
                application/zip zip;
                text/plain txt;
            }
            default_type application/octet-stream;
            add_header Accept-Ranges bytes always;
            expires 1h;
        }

        location / {
            root "D:/98281/online education platform/WHU-ol-education-platform/frontend/dist";
            try_files $uri $uri/ /index.html;
        }
    }
}
